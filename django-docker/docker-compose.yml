services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:latest
    networks:
      - main
    ports:
      - "5672:5672"
    restart: always

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - main
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  celery_worker:
    container_name: celery_worker
    command: "celery -A A worker -l INFO"
    depends_on:
      - app 
      - rabbitmq
      - postgres
    build: .
    environment:
      - C_FORCE_ROOT=true
    networks:
      - main
    restart: always
    
  app:
    build: .
    command: sh -c "python manage.py migrate && gunicorn A.wsgi:application --bind 0.0.0.0:8000"
    container_name: app
    volumes:
      - .:/code/
    depends_on:
      - postgres
      - rabbitmq
    expose:
      - 8000
    networks:
      - main
    restart: always

  nginx:
    container_name: nginx
    image: nginx:latest
    command: nginx -g 'deamon off;'
    depends_on:
      - app
    networks:
      - main
    ports: 
      - "80:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

networks:
  main:
    driver: bridge

volumes:
  postgres_data:

    


     